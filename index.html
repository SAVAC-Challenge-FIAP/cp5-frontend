<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS v4 (Play CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome - Ícones -->
    <script src="https://kit.fontawesome.com/ee18729cda.js" crossorigin="anonymous"></script>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tema Tailwind v4 (design tokens via @theme) — design system do Figma -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;

            /* Cores principais */
            --color-primary-red: #C31252;
            --color-primary-red-pressed: #62112E;
            --color-vivid-violet: #9D347A;
            --color-tertiary-pink: #F20D92;
            --color-tertiary-blue: #0C376C;

            /* Neutros */
            --color-primary-dark: #0A0C10;
            --color-light-dark: #424345;
            --color-dark-grey: #7D7E80;
            --color-blue-grey: #95A1AD;
            --color-pink-grey: #9B8595;
            --color-grey: #B9B9B9;
            --color-light-grey: #D8D8D8;
            --color-on-primary: #E7F2EF;

            /* Tipografia — tamanhos do Figma, reduzidos no mobile com clamp() */
            --text-h1: clamp(3rem, 8vw, 6rem);
            --text-h1--line-height: 1;
            --text-h1--font-weight: 800;
            --text-h2: clamp(2.5rem, 6vw, 4.6875rem);
            --text-h2--line-height: 1.1;
            --text-h2--font-weight: 800;
            --text-h3: clamp(2rem, 4vw, 3rem);
            --text-h3--line-height: 1.1;
            --text-h3--font-weight: 800;
            --text-h4: 1.5rem;
            --text-h4--line-height: 1.1;
            --text-h4--font-weight: 700;
            --text-h5: 1.375rem;
            --text-h5--line-height: 1;
            --text-h5--font-weight: 500;
            --text-h6: 1.25rem;
            --text-h6--line-height: 1;
            --text-h6--font-weight: 500;
            --text-p1: 1.375rem;
            --text-p1--line-height: 1.5;
            --text-p2: 1.25rem;
            --text-p2--line-height: 1.5;
            --text-label: 1.125rem;
            --text-label--line-height: 1.5;
        }

        @layer components {
            /* Botão primário: default / hover / pressed / focus / disabled */
            .btn-primary {
                @apply inline-flex items-center justify-center rounded-xl bg-primary-red px-12 py-5
                    text-label font-semibold capitalize text-on-primary transition-colors
                    hover:bg-vivid-violet active:bg-primary-red-pressed
                    focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-tertiary-pink
                    disabled:pointer-events-none disabled:opacity-50;
            }

            /* Título com gradiente (branco → branco 38%) */
            .text-gradient {
                @apply bg-linear-to-b from-white to-white/40 bg-clip-text text-transparent;
            }

            /* Superfícies translúcidas sobre fundo escuro */
            .surface-glass {
                @apply rounded-2xl border border-white/13 bg-white/3;
            }
        }
    </style>

    <!-- Estilos do projeto (CSS que não vira classe utilitária) -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <title>Melodia | Sua Música, Sua Forma</title>
</head>

<body class="font-sans antialiased">

    <!-- conteúdo do CP5 -->
    

    <script src="js/main.js"></script>
</body>

</html>
